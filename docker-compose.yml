services:
  crm:
    build:
      context: .
      dockerfile: examples/crm/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      FRAMEKIT_SETTINGS_ACTIVE_KEY: ${FRAMEKIT_SETTINGS_ACTIVE_KEY:?set FRAMEKIT_SETTINGS_ACTIVE_KEY}
      FRAMEKIT_SETTINGS_KEYS: ${FRAMEKIT_SETTINGS_KEYS:?set FRAMEKIT_SETTINGS_KEYS}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      FRAMEKIT_S3_BUCKET: ${FRAMEKIT_S3_BUCKET:?set FRAMEKIT_S3_BUCKET}
      FRAMEKIT_S3_ENDPOINT: ${FRAMEKIT_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: ${FRAMEKIT_POSTGRES_URL:-postgresql://framekit:framekit@postgres:5432/framekit}
      REDIS_URL: redis://redis:6379
      FRAMEKIT_ALLOWED_ORIGINS: ${FRAMEKIT_ALLOWED_ORIGINS:?set FRAMEKIT_ALLOWED_ORIGINS}
      FRAMEKIT_TRUST_PROXY: ${FRAMEKIT_TRUST_PROXY:-false}
      FRAMEKIT_COOKIE_SAME_SITE: ${FRAMEKIT_COOKIE_SAME_SITE:-lax}
      FRAMEKIT_AUTH_SECRET: ${FRAMEKIT_AUTH_SECRET:?set FRAMEKIT_AUTH_SECRET}
      FRAMEKIT_ADMIN_EMAIL: ${FRAMEKIT_ADMIN_EMAIL:?set FRAMEKIT_ADMIN_EMAIL}
      FRAMEKIT_ADMIN_PASSWORD: ${FRAMEKIT_ADMIN_PASSWORD:?set FRAMEKIT_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: framekit
      POSTGRES_PASSWORD: ${FRAMEKIT_POSTGRES_PASSWORD:-framekit}
      POSTGRES_DB: framekit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framekit -d framekit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
